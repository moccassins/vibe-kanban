name: Build & Push Cloud Image

on:
  workflow_dispatch: # manual trigger to avoid surprise costs
  push:
    branches: [main]
    paths:
      - 'crates/remote/**'
      - 'crates/server/**'
      - 'crates/db/**'
      - 'crates/mcp/**'
      - 'crates/executors/**'
      - 'crates/services/**'
      - 'crates/git-host/**'
      - 'crates/git/**'
      - 'crates/review/**'
      - 'crates/worktree-manager/**'
      - 'crates/workspace-manager/**'
      - 'crates/relay-control/**'
      - 'crates/server-info/**'
      - 'crates/deployment/**'
      - 'crates/local-deployment/**'
      - 'crates/api-types/**'
      - 'crates/relay-types/**'
      - 'crates/utils/**'
      - 'assets/**'
      - 'shared/**'
      - 'packages/remote-web/**'
      - 'packages/web-core/**'
      - 'packages/ui/**'
      - 'packages/public/**'
      - 'packages/local-web/tailwind.new.config.js'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'rust-toolchain.toml'
      - 'patches/**'
      - '.github/workflows/build-cloud-image.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vibe-kanban-cloud

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache FE deps separately (cheap layer)
      - name: Build Cloud Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/remote/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_NAME=remote
            FEATURES=
