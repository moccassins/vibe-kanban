[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:find-electric]
command=bash -c "find /app/electric-root -name '*.jar' -type f | head -1 > /tmp/electric-jar.txt; if [ ! -s /tmp/electric-jar.txt ]; then echo 'Trying alternate locations...' && find /app/electric-root -name 'electric' -type f -executable | head -1 > /tmp/electric-jar.txt; fi; cat /tmp/electric-jar.txt"
stdout_logfile=/var/log/supervisor/find-electric.log
stderr_logfile=/var/log/supervisor/find-electric.log
autorestart=false
startsecs=2

[program:electric]
command=bash -c "JAR=$(cat /tmp/electric-jar.txt); if echo $JAR | grep -q '\\.jar$'; then java -jar $JAR -H 0.0.0.0 -P %(ENV_ELECTRIC_PORT)s --database-url=%(ENV_ELECTRIC_DATABASE_URL)s --pg-proxy-port=65432 --auth-mode=insecure --log-level=info; elif [ -f $JAR ]; then $JAR -H 0.0.0.0 -P %(ENV_ELECTRIC_PORT)s --database-url=%(ENV_ELECTRIC_DATABASE_URL)s --pg-proxy-port=65432 --auth-mode=insecure --log-level=info; else echo 'ElectricSQL not found!'; sleep 3600; fi"
environment=HOME="/srv/electric-data",ELECTRIC_INSECURE="true",ELECTRIC_MANUAL_TABLE_PUBLISHING="true",ELECTRIC_USAGE_REPORTING="false",ELECTRIC_FEATURE_FLAGS="allow_subqueries,tagged_subqueries"
directory=/srv/electric-data
stdout_logfile=/var/log/supervisor/electric-stdout.log
stderr_logfile=/var/log/supervisor/electric-stderr.log
autorestart=true
startsecs=10
startretries=10
depends_on=find-electric

[program:remote]
command=/usr/local/bin/remote
stdout_logfile=/var/log/supervisor/remote-stdout.log
stderr_logfile=/var/log/supervisor/remote-stderr.log
autorestart=true
startsecs=5
startretries=10
depends_on=electric
