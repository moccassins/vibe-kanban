[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:electric]
command=bash -c "JAR=$(cat /tmp/electric-jar-path.txt); if [ -n \"$JAR\" ] && [ -f \"$JAR\" ]; then exec java -jar $JAR -H 0.0.0.0 -P %(ENV_ELECTRIC_PORT)s --database-url=%(ENV_ELECTRIC_DATABASE_URL)s --pg-proxy-port=65432 --auth-mode=insecure --log-level=info; else echo 'ElectricSQL JAR not found at '$JAR'; ls -la /app/electric/ 2>/dev/null; echo 'Waiting...'; sleep 3600; fi"
environment=HOME="/srv/electric-data",ELECTRIC_INSECURE="true",ELECTRIC_MANUAL_TABLE_PUBLISHING="true",ELECTRIC_USAGE_REPORTING="false",ELECTRIC_FEATURE_FLAGS="allow_subqueries,tagged_subqueries"
directory=/srv/electric-data
stdout_logfile=/var/log/supervisor/electric-stdout.log
stderr_logfile=/var/log/supervisor/electric-stderr.log
autorestart=true
startsecs=10
startretries=10

[program:remote]
command=/usr/local/bin/remote
stdout_logfile=/var/log/supervisor/remote-stdout.log
stderr_logfile=/var/log/supervisor/remote-stderr.log
autorestart=true
startsecs=5
startretries=10
