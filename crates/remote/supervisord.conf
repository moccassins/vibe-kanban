[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:electric]
command=docker run --rm --name electric-sql \
    --network host \
    -v /srv/electric-data:/app/persistent \
    -e DATABASE_URL=%(ENV_SERVER_DATABASE_URL)s \
    -e PG_PROXY_PORT=65432 \
    -e AUTH_MODE=insecure \
    -e ELECTRIC_INSECURE=true \
    -e ELECTRIC_MANUAL_TABLE_PUBLISHING=true \
    -e ELECTRIC_USAGE_REPORTING=false \
    -e ELECTRIC_FEATURE_FLAGS=allow_subqueries,tagged_subqueries \
    electricsql/electric:1.4.13
stdout_logfile=/var/log/supervisor/electric-stdout.log
stderr_logfile=/var/log/supervisor/electric-stderr.log
autorestart=true
startsecs=10
startretries=10

[program:remote]
command=/usr/local/bin/remote
stdout_logfile=/var/log/supervisor/remote-stdout.log
stderr_logfile=/var/log/supervisor/remote-stderr.log
autorestart=true
startsecs=5
startretries=10
